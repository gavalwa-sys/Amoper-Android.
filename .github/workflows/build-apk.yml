
name: Build AMOPER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Searching for Android project..."

          GRADLEW=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          echo "Building APK..."

          "$GRADLEW" assembleDebug --stacktrace

      - name: Show generated APK
        run: |
          echo "Searching for generated APK..."

          find . -type f -name "*.apk" -print

      - name: Upload AMOPER APK
        uses: actions/upload-artifact@v4
        with:
          name: AMOPER-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 30
```
