
name: Build AMOPER APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android project
        id: android-project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          PROJECT_DIR=""

          # First preference: Gradle wrapper
          GRADLEW=$(find . -type f -name "gradlew" -not -path "./.git/*" | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            # Fallback: find settings.gradle/settings.gradle.kts
            SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -n 1 || true)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android Gradle project was found."
            echo "The repository must contain gradlew or settings.gradle/settings.gradle.kts."
            exit 1
          fi

          # Convert ./ to .
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android project
        working-directory: ${{ steps.android-project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Android project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.android-project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing from the Android project."
            echo "Project directory: $(pwd)"
            exit 1
          fi

          chmod +x ./gradlew

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.android-project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew --version

      - name: Build AMOPER Debug APK
        working-directory: ${{ steps.android-project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.android-project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::No debug APK was generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload AMOPER APK
        uses: actions/upload-artifact@v4
        with:
          name: AMOPER-debug-apk
          path: ${{ steps.android-project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
```
